<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Affirmations with Billy Joel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23222'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Georgia,serif' fill='%23f0ead6' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
    <meta name="description" content="Start your day with wisdom from the Piano Man. Random Billy Joel lyrics served as daily affirmations.">

    <!-- Open Graph -->
    <meta property="og:title" content="Daily Affirmations with Billy Joel">
    <meta property="og:description" content="Start your day with wisdom from the Piano Man">
    <meta property="og:type" content="website">

    <!-- Fonts: Michroma for the engraving on the deck, Special Elite for the typed card -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Special+Elite&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Album Collage Background -->
    <div class="album-collage-bg" aria-hidden="true">
        <div class="album-tile cold-spring-harbor"></div>
        <div class="album-tile piano-man"></div>
        <div class="album-tile streetlife-serenade"></div>
        <div class="album-tile turnstiles"></div>
        <div class="album-tile the-stranger"></div>
        <div class="album-tile street-52nd"></div>
        <div class="album-tile glass-houses"></div>
        <div class="album-tile nylon-curtain"></div>
        <div class="album-tile innocent-man"></div>
        <div class="album-tile the-bridge"></div>
        <div class="album-tile storm-front"></div>
        <div class="album-tile river-of-dreams"></div>
    </div>
    <div class="album-collage-overlay" aria-hidden="true"></div>

    <main class="page">
        <header class="masthead">
            <h1 class="site-title">Daily Affirmations</h1>
            <p class="site-subtitle">with Billy Joel</p>
        </header>

        <div class="picker">
            <label for="song-selector" class="picker-label">Pick a song, or press Play for a random one</label>
            <select id="song-selector" class="song-selector">
                <option value="">Choose a Billy Joel song</option>
            </select>
        </div>

        <!-- The deck -->
        <section class="deck" aria-label="Tape deck">
            <div class="cheek" aria-hidden="true"></div>
            <div class="face">
                <div class="face-top">
                    <span class="engrave model">JOEL BR-77</span>
                    <span class="engrave speed">7½ IPS</span>
                    <svg id="transport" class="transport" viewBox="0 0 1000 540" aria-hidden="true"></svg>
                </div>

                <div class="bridge">
                    <div class="meters" aria-hidden="true">
                        <div class="vu"><svg viewBox="0 0 220 130"></svg><span class="engrave light">Left</span></div>
                        <div class="vu"><svg viewBox="0 0 220 130"></svg><span class="engrave light">Right</span></div>
                    </div>
                    <div class="counter">
                        <div class="odometer" id="odometer" aria-hidden="true"></div>
                        <button type="button" class="reset" id="btn-reset" aria-label="Reset the tape counter">Reset</button>
                    </div>
                    <div class="power" aria-hidden="true"><i class="lamp"></i><span class="engrave light">Power</span></div>
                </div>

                <div class="keys" role="toolbar" aria-label="Tape controls">
                    <button type="button" class="key" id="btn-rewind" aria-label="Previous affirmation">
                        <span class="legend"><i class="led amber"></i>Back</span>
                        <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6v12L2 12zM21 6v12l-9-6z"/></svg></span>
                    </button>
                    <button type="button" class="key" id="btn-forward" aria-label="Next affirmation">
                        <span class="legend"><i class="led amber"></i>Next</span>
                        <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6v12l9-6zM13 6v12l9-6z"/></svg></span>
                    </button>
                    <button type="button" class="key" id="btn-stop" aria-label="Stop">
                        <span class="legend"><i class="led off"></i>Stop</span>
                        <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></span>
                    </button>
                    <button type="button" class="key play" id="btn-play" aria-label="Play">
                        <span class="legend"><i class="led green"></i>Play</span>
                        <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg></span>
                    </button>
                    <button type="button" class="key rec" id="btn-record" aria-label="Random affirmation">
                        <span class="legend"><i class="led red"></i>Shuffle</span>
                        <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg></span>
                    </button>
                </div>
            </div>
            <div class="cheek" aria-hidden="true"></div>
        </section>

        <!-- The tape box card the affirmation gets typed onto -->
        <article class="card" aria-label="Today's affirmation">
            <header class="card-head">
                <h2 class="card-song" id="song-title">Today's affirmation</h2>
                <span class="card-track" id="track-no"></span>
                <p class="card-album" id="album-info">Pick a song to have it typed here</p>
            </header>
            <blockquote class="lyric-text" id="lyric-display" aria-hidden="true"></blockquote>
            <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
            <footer class="card-foot">
                <p class="card-note" id="card-note" aria-live="polite"></p>
                <a class="apple-link" id="apple-link" href="https://music.apple.com/us/search?term=billy%20joel" target="_blank" rel="noopener" hidden>Listen on Apple Music</a>
            </footer>
        </article>
    </main>

    <footer class="footer">
        <p>Made with ♥ for the Piano Man</p>
        <p class="credit">Song previews from Apple Music</p>
        <p class="keyboard-hint">
            <kbd>Space</kbd> Play or pause, <kbd>N</kbd> Next, <kbd>←</kbd> Back
        </p>
    </footer>

    <script src="js/affirmations.js"></script>
    <script src="js/player.js"></script>
    <script src="js/music.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
